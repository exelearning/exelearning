# ⚠️ WARNING: This docker-compose file is mainly intended for development.
# For production deployments, please use the example docker-compose files
# provided in doc/deploy/ examples for SQLite, MariaDB and PostgreSQL.
---

services:
  exelearning:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUN_VERSION: ${BUN_VERSION:-1.3}
        VERSION: ${VERSION:-v0.0.0-alpha}

    image: exelearning-local:dev
    container_name: exelearning
    hostname: exelearning

    # Apple Silicon fallback:
    # Keep this commented by default. Only enable it if the native arm64 build fails.
    # platform: linux/amd64

    # Local Docker defaults: .env.dist baseline + .env overrides
    env_file:
      - .env.dist
      - .env

    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"

    restart: unless-stopped

    volumes:
      # Persistent uploaded assets
      - mnt-data:/mnt/data:rw

      # SQLite database persistence
      - ./data:/app/data:rw

    environment:
      # Development/demo Docker credentials.
      # For real deployments, override these in .env with strong values.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-user@exelearning.net}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-1234}

      PRE_CONFIGURE_COMMANDS:
      POST_CONFIGURE_COMMANDS: |
        echo "Docker post-configuration completed"
      # ⚠️ WARNING: Uncomment this for using MariaDB as local database for development
      # DB_DRIVER: pdo_mysql
      # DB_HOST: mariadb
      # DB_PORT: 3306
      # DB_NAME: "${DB_NAME:-exelearning}"
      # DB_USER: "${DB_USER:-exelearning}"
      # DB_PASSWORD: "${DB_PASSWORD:-exelearning}"
      # DB_CHARSET: "${DB_CHARSET:-utf8mb4}"
      # DB_SERVER_VERSION: 10.6

      # depends_on:
      #   - mariadb

      # mariadb:
      #   image: mariadb:12.0
      #   restart: unless-stopped
      #   environment:
      #     MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root}"
      #     MARIADB_DATABASE: "${DB_NAME:-exelearning}"
      #     MARIADB_USER: "${DB_USER:-exelearning}"
      #     MARIADB_PASSWORD: "${DB_PASSWORD:-exelearning}"

volumes:
  mnt-data:
