# Tuned file-descriptor limits (per issue #2255's suggested values),
# WebSocket upstream still on ip_hash. This isolates the FD/worker_connections
# variable against nginx-baseline-default.conf: compare those two first.
# Then compare this file against nginx-tuned-least-conn.conf to isolate the
# load-balancing-algorithm variable (ip_hash vs least_conn) with FD limits
# held constant.

worker_processes auto;
worker_rlimit_nofile 200000;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 32768;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream exelearning_backend {
        least_conn;
        server exelearning-1:8080 max_fails=3 fail_timeout=30s;
        server exelearning-2:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ip_hash: every client IP is pinned to the same backend. With a single
    # load-generator machine (one source IP), this can route most or all
    # WebSocket connections to one instance — the exact concern raised in
    # issue #2255. See nginx-tuned-least-conn.conf for the comparison.
    upstream exelearning_websocket {
        ip_hash;
        server exelearning-1:8080 max_fails=3 fail_timeout=30s;
        server exelearning-2:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /yjs/ {
            proxy_pass http://exelearning_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://exelearning_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            client_max_body_size 1024M;
        }

        location / {
            proxy_pass http://exelearning_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_valid 200 1h;
            client_max_body_size 1024M;
        }
    }
}
