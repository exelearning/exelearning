# Tuned file-descriptor limits (per issue #2255's suggested values),
# WebSocket upstream switched to least_conn. Compare against
# nginx-tuned-ip-hash.conf (identical otherwise) to isolate the
# load-balancing-algorithm variable, with FD limits held constant.

worker_processes auto;
worker_rlimit_nofile 200000;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 32768;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream exelearning_backend {
        least_conn;
        server exelearning-1:8080 max_fails=3 fail_timeout=30s;
        server exelearning-2:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # least_conn: routes each new connection to whichever backend currently has
    # the fewest active connections, regardless of client IP. This avoids the
    # single-source-IP skew ip_hash can cause when load is generated from one
    # machine, at the cost of losing "same client always hits the same backend"
    # affinity — acceptable here since Redis already synchronizes Yjs state
    # across instances (see doc/high-availability.md).
    upstream exelearning_websocket {
        least_conn;
        server exelearning-1:8080 max_fails=3 fail_timeout=30s;
        server exelearning-2:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /yjs/ {
            proxy_pass http://exelearning_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://exelearning_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            client_max_body_size 1024M;
        }

        location / {
            proxy_pass http://exelearning_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_valid 200 1h;
            client_max_body_size 1024M;
        }
    }
}
