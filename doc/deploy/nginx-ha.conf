# Nginx Load Balancer Configuration for eXeLearning HA
# This file should be placed alongside docker-compose.redis.yml
#
# Features:
# - least_conn load balancing for both HTTP and WebSocket
# - WebSocket upgrade handling for /yjs/*
# - Gzip compression
# - Health check endpoint
#
# worker_connections and least_conn (below) were validated against issue #2255's
# C10k benchmark (see doc/development/c10k-benchmark.md and test/load/deploy/):
# with the previous defaults (worker_connections 1024, ip_hash for the
# WebSocket upstream), 1000 concurrent WebSocket connections from a single
# load-generator IP saw a 58.4% login success rate and routed ~100% of
# connections to one backend instance. The values below gave 100% success at
# under 15% instance CPU, and split load evenly across instances.
# Decision record: doc/architecture/adr/ADR-2255-01-balance-websocket-upstream-with-least-conn.md

worker_processes auto;
worker_rlimit_nofile 200000;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 32768;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with upstream info
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-font-ttf
               font/opentype image/svg+xml;

    # Connection upgrade map for WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream configuration - least_conn, same as the WebSocket upstream below
    # No sticky sessions needed - stateless JWT auth
    upstream exelearning_backend {
        # Least connections algorithm for better distribution
        least_conn;

        server exelearning-1:8080 max_fails=3 fail_timeout=30s;
        server exelearning-2:8080 max_fails=3 fail_timeout=30s;

        # Keep connections alive to backend
        keepalive 32;
    }

    # WebSocket upstream - uses same backend but with different settings.
    # Uses least_conn, not ip_hash: Redis already synchronizes Yjs state
    # across instances, so pinning a client to one backend buys nothing —
    # and with a small number of load-generator/client-gateway IPs, ip_hash
    # can route effectively all connections to a single instance (measured
    # directly: ~100% of connections from one source IP landed on one
    # instance under ip_hash, vs. an even split under least_conn).
    upstream exelearning_websocket {
        least_conn;

        server exelearning-1:8080 max_fails=3 fail_timeout=30s;
        server exelearning-2:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint for load balancer
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # WebSocket endpoint for Yjs collaboration
        location /yjs/ {
            proxy_pass http://exelearning_websocket;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeout settings (7 days)
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # Disable buffering for WebSocket
            proxy_buffering off;
        }

        # API endpoints
        location /api/ {
            proxy_pass http://exelearning_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts for API calls
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Large file uploads (1GB)
            client_max_body_size 1024M;
        }

        # Static files and pages
        location / {
            proxy_pass http://exelearning_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Cache static assets
            proxy_cache_valid 200 1h;

            # Large file uploads (1GB)
            client_max_body_size 1024M;
        }
    }
}
