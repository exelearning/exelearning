# Extra MIME mappings for the static eXeLearning image.
#
# nginx ships a small mime.types table (verified still true on nginx 1.31) and
# falls back to `default_type application/octet-stream` for anything missing.
# The cost of a missing entry is a silent, hard-to-diagnose failure (see .mjs
# below); the cost of an unused one is a line of config. So this table covers
# the content types eXeLearning deals with, not only the ones that happen to be
# in dist/static today.
#
#   .mjs   ES modules. Browsers apply strict MIME checking to module scripts, so
#          `application/octet-stream` makes `import()` fail outright. This is
#          what broke the PDF preview. eXeLearning's own bundles are named .js
#          for that reason; this mapping keeps the failure from coming back.
#   .ttf   Fonts (~150 files in dist/static). Browsers tolerate the wrong type,
#   .otf   but it defeats content sniffing and is simply incorrect.
#   .vtt   Subtitle tracks. <track> expects text/vtt.
#   .glb   3D models for the 3D Viewer iDevice.
#   .gltf
#   .stl
#   .webmanifest  PWA manifests.
#
# A `types` block in this context merges with the mime.types included by the
# default nginx.conf, so existing mappings (.js, .css, ...) are preserved.
types {
    text/javascript                  mjs;
    font/ttf                         ttf;
    font/otf                         otf;
    text/vtt                         vtt;
    model/gltf-binary                glb;
    model/gltf+json                  gltf;
    model/stl                        stl;
    application/manifest+json        webmanifest;
}
