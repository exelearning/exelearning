<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eXeLearning preview</title>
    <!--
      Opaque "preview host" page for opening a preview in a NEW TAB.

      Opening the opaque preview content directly as a top-level document breaks
      external media: the embed shim only runs when it has a parent
      (`window.parent !== window`), so a standalone tab leaves the raw cross-origin
      iframe (blocked by the content CSP). This same-origin page frames the opaque
      content in one sandboxed iframe and runs the embed relay, becoming the trusted
      parent that overlays the real player in-place — exactly like the editor panel.

      Used only by the HTTP transport: `?session=<uuid>` frames the same-origin
      capability URL `preview/<uuid>/index.html` directly. The session lives on the
      server (or the Electron main process). The framed content stays opaque via its
      own response CSP. All URLs are relative so it works unchanged under a BASE_PATH
      prefix.

      (The static Service Worker transport opens its own /viewer/ URL directly and
      does not use this host page. The removed srcdoc push protocol is gone.)
    -->
    <style>
        html, body { margin: 0; height: 100%; }
        body { overflow: hidden; background: #fff; }
        #exe-preview-host { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <iframe id="exe-preview-host" title="Preview" referrerpolicy="no-referrer" allow="fullscreen"
        sandbox="allow-scripts allow-popups allow-forms"></iframe>
    <script src="app/common/exe_media_bridge/exe_media_policy.js"></script>
    <script src="app/common/exe_media_bridge/exe-media-host.js"></script>
    <script src="app/common/exe_embed_bridge/exe_embed_relay.js"></script>
    <script>
        (function () {
            var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            var iframe = document.getElementById('exe-preview-host');
            var relayStarted = false;

            // Start the embed relay once the framed content exists (like the editor panel,
            // which attaches the relay after the iframe has content), then (re)ping on every
            // (re)load so the shim re-reports embed geometry and the relay overlays the real
            // player in-place — no click.
            var pingTimer = null;
            iframe.addEventListener('load', function () {
                if (!relayStarted && window.exeEmbedRelay) {
                    try {
                        window.exeEmbedRelay.init({ mode: 'open' });
                        relayStarted = true;
                    } catch (e) {
                        /* non-fatal */
                    }
                }
                // Re-ping a few times rather than once: under load the shim (inside the
                // framed content) and the relay can initialise in either order, so a single
                // request can arrive before the shim is listening and be lost — leaving the
                // player un-overlaid. Poll briefly until the shim re-reports.
                if (pingTimer) {
                    clearInterval(pingTimer);
                }
                var pings = 0;
                var sendPing = function () {
                    try {
                        iframe.contentWindow.postMessage({ type: 'exe-embed', action: 'request' }, '*');
                    } catch (e) {
                        /* opaque content: postMessage is still delivered */
                    }
                };
                sendPing();
                pingTimer = setInterval(function () {
                    sendPing();
                    if (++pings >= 12) {
                        clearInterval(pingTimer);
                        pingTimer = null;
                    }
                }, 400);
            });

            var params = new URLSearchParams(window.location.search);
            var session = params.get('session');

            // HTTP transport: frame the same-origin opaque capability URL directly.
            // Anything without a valid UUID session is not a supported entry point.
            if (session && UUID_RE.test(session)) {
                iframe.src = 'preview/' + session + '/index.html?exe-teacher=1';
            }
        })();
    </script>
</body>
</html>
