<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Benzene ring representation -->
  <g transform="translate(32,32)">
    <!-- Outer hexagon -->
    <polygon points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10"
             fill="none" stroke="#1a6b8a" stroke-width="3" stroke-linejoin="round"/>
    <!-- Inner circle (aromatic ring) -->
    <circle cx="0" cy="0" r="11" fill="none" stroke="#1a6b8a" stroke-width="2.5"/>
    <!-- Bond lines to vertices -->
    <line x1="0" y1="-20" x2="0" y2="-11" stroke="#1a6b8a" stroke-width="2.5"/>
    <line x1="17.3" y1="10" x2="9.5" y2="5.5" stroke="#1a6b8a" stroke-width="2.5"/>
    <line x1="-17.3" y1="10" x2="-9.5" y2="5.5" stroke="#1a6b8a" stroke-width="2.5"/>
  </g>
</svg>
