<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Not Found</title>
  <style>
    :root{--bg:#f8fafc;--card:#ffffff;--muted:#6b7280;--accent:#1f7bd8}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial; background:var(--bg); color:#111}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
    .card{background:var(--card);border-radius:12px;box-shadow:0 6px 20px rgba(2,6,23,.08);max-width:720px;width:100%;padding:36px}
    h1{margin:0 0 8px;font-size:32px}
    p{margin:0 0 16px;color:var(--muted)}
    a.button{display:inline-block;padding:10px 14px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none}
    .meta{margin-top:12px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>404 — Page Not Found</h1>
      <p>The resource you are trying to preview is not available. It may have been deleted or moved.</p>
      <a class="button" href="/">Back to Home</a>
      <div class="meta">If you believe this is an error, please check that the URL is correct or contact the administrator.</div>
    </div>
  </div>
</body>
</html>
