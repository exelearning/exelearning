<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind map editor</title>
<script>
// Loads the editor, built by scripts/build-mindmap-editor.ts from src/ (Mind Elixir,
// modern-screenshot and @ateeducacion/mind-elixir-export-mermaid), from this folder.
// Static servers with clean URLs serve this page as ".../editor" or ".../editor/index",
// which would resolve relative paths one folder up, so a <base> points them here. The
// files are added from this script, after the <base>: as plain tags, the browser's
// preload scanner would request them before the <base> exists, from the wrong folder.
(function () {
    var path = location.pathname;
    if (!/\/$|\.html?$/.test(path)) {
        var base = document.createElement('base');
        base.href = path.replace(/\/index$/, '') + '/';
        document.head.appendChild(base);
    }
    var style = document.createElement('link');
    style.rel = 'stylesheet';
    style.href = 'mindmap-editor.bundle.css';
    document.head.appendChild(style);
    var script = document.createElement('script');
    script.src = 'mindmap-editor.bundle.js';
    document.head.appendChild(script);
})();
</script>
</head>
<body>
</body>
</html>
