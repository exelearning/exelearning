name: Debug Euskadi curriculum parser

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/lomloe-add-euskadi-dataset
    paths:
      - .github/workflows/debug-es-pv-parser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check pdfplumber requests

      - name: Download official Basque decrees and parser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          import requests

          candidates = {
              'eu.pdf': [
                  'https://www.euskadi.eus/bopv2/datos/2023/06/2302729e.pdf',
                  'https://www.euskadi.eus/bopv2/datos/2023/06/2302729a.pdf',
              ],
              'inf.pdf': [
                  'https://www.euskadi.eus/bopv2/datos/2023/06/2302727e.pdf',
                  'https://www.euskadi.eus/bopv2/datos/2023/06/2302727a.pdf',
              ],
          }
          for output, urls in candidates.items():
              for url in urls:
                  response = requests.get(url, timeout=60)
                  print(url, response.status_code, response.headers.get('content-type'), len(response.content))
                  if response.ok and response.content.startswith(b'%PDF'):
                      Path(output).write_bytes(response.content)
                      break
              else:
                  raise SystemExit(f'Unable to download {output}')

          api_url = 'https://api.github.com/repos/exelearning/exelearning/issues/comments/4848125611'
          response = requests.get(
              api_url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              timeout=60,
          )
          response.raise_for_status()
          body = response.json()['body']
          match = re.search(r'```python\n(.*?)\n```', body, re.S)
          if not match:
              raise SystemExit('Parser code block not found in PR comment')
          script = match.group(1)
          script = re.sub(r"^EU = .*?$", "EU = 'eu.pdf'", script, flags=re.M)
          script = re.sub(r"^INF = .*?$", "INF = 'inf.pdf'", script, flags=re.M)
          script = re.sub(r"^OUT = .*?$", "OUT = 'generated.json'", script, flags=re.M)
          Path('parse_es_pv.py').write_text(script + '\n', encoding='utf-8')
          PY

      - name: Run existing parser and compare output
        run: |
          python parse_es_pv.py
          sha256sum generated.json public/files/perm/idevices/base/lomloe/data/lomloe-ES-PV.json
          cmp generated.json public/files/perm/idevices/base/lomloe/data/lomloe-ES-PV.json

      - name: Print ESO parser diagnostics
        run: |
          python - <<'PY'
          import importlib.util
          import re

          import pdfplumber

          spec = importlib.util.spec_from_file_location('parser', 'parse_es_pv.py')
          parser = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(parser)

          with pdfplumber.open('eu.pdf') as pdf:
              print('EU pages:', len(pdf.pages))
              print('First page:', (pdf.pages[0].extract_text() or '')[:500])
              print('\nDetected materia starts:')
              for title, page in parser._materia_pages(pdf, 128, 349):
                  print(f'{page + 1:03d}: {title} -> {parser.ESO_MATERIAS[title]}')

              print('\nAll uppercase heading candidates not mapped:')
              seen = set()
              for page_index in range(128, 349):
                  for line in parser.page_lines(pdf.pages[page_index]):
                      text = line['text'].strip()
                      if (
                          text not in seen
                          and text not in parser.ESO_MATERIAS
                          and len(text) >= 5
                          and text == text.upper()
                          and re.search(r'[A-ZÁÉÍÓÚÜÑ]', text)
                          and len(text) <= 120
                      ):
                          seen.add(text)
                          if any(word in text for word in ('MUSIKA', 'LATIN', 'LATINA', 'KULTURA', 'MATEMATIKA', 'ARTIST')):
                              print(f'{page_index + 1:03d}: {text}')

              print('\nExtraction summary:')
              for title, code, denom, data in parser.extract_eso(pdf):
                  if 'error' in data:
                      print(code, 'ERROR', data['error'])
                      continue
                  saber_count = sum(
                      len(items)
                      for _courses, blocks in data['saber_blocks']
                      for _block, _subblock, items in blocks
                  )
                  print(code, 'courses=', data['course_cols'], 'competencias=', len(data['competencias']),
                        'criterio groups=', len(data['crit_by_comp']), 'saberes=', saber_count)
          PY
