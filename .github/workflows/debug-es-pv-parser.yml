name: Debug Euskadi curriculum parser

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/lomloe-add-euskadi-dataset
    paths:
      - .github/workflows/debug-es-pv-parser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check pdfplumber requests

      - name: Capture official ESO headings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import importlib.util
          import os
          import re
          from pathlib import Path

          import pdfplumber
          import requests

          pdf_url = 'https://www.euskadi.eus/bopv2/datos/2023/06/2302729e.pdf'
          response = requests.get(pdf_url, timeout=60)
          response.raise_for_status()
          Path('eu.pdf').write_bytes(response.content)

          api_url = 'https://api.github.com/repos/exelearning/exelearning/issues/comments/4848125611'
          response = requests.get(
              api_url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              timeout=60,
          )
          response.raise_for_status()
          match = re.search(r'```python\n(.*?)\n```', response.json()['body'], re.S)
          if not match:
              raise SystemExit('Parser code block not found')
          script = match.group(1)
          script = re.sub(r"^EU = .*?$", "EU = 'eu.pdf'", script, flags=re.M)
          script = re.sub(r"^INF = .*?$", "INF = 'inf.pdf'", script, flags=re.M)
          script = re.sub(r"^OUT = .*?$", "OUT = 'generated.json'", script, flags=re.M)
          Path('parse_es_pv.py').write_text(script + '\n', encoding='utf-8')

          spec = importlib.util.spec_from_file_location('parser', 'parse_es_pv.py')
          parser = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(parser)

          keywords = ('MUSIKA', 'LATIN', 'KULTURA', 'ZIENTIF', 'MATEMATIKA', 'TAILER', 'LANTEGI', 'ARTIST')
          output = []
          with pdfplumber.open('eu.pdf') as pdf:
              output.append(f'pages={len(pdf.pages)}')
              output.append('DETECTED MAPPED HEADINGS')
              for title, page in parser._materia_pages(pdf, 128, 349):
                  output.append(f'{page + 1:03d}\t{title}\t{parser.ESO_MATERIAS[title]}')
              output.append('UNMAPPED KEYWORD HEADINGS')
              seen = set()
              for page_index in range(128, 349):
                  for line in parser.page_lines(pdf.pages[page_index]):
                      text = line['text'].strip()
                      if (
                          text not in seen
                          and text not in parser.ESO_MATERIAS
                          and 4 <= len(text) <= 140
                          and text == text.upper()
                          and any(word in text for word in keywords)
                      ):
                          seen.add(text)
                          output.append(f'{page_index + 1:03d}\t{text}')
          Path('diagnostics.txt').write_text('\n'.join(output) + '\n', encoding='utf-8')
          print(Path('diagnostics.txt').read_text(encoding='utf-8'))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: es-pv-parser-diagnostics
          path: diagnostics.txt
