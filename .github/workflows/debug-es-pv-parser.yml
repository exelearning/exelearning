name: Apply Euskadi curriculum fixes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/lomloe-add-euskadi-dataset
    paths:
      - .github/workflows/debug-es-pv-parser.yml
  workflow_dispatch:

concurrency:
  group: apply-es-pv-fixes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lomloe-add-euskadi-dataset
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore parser and apply source changes
        run: |
          cat .github/es-pv-parser/parser.b64.* \
            | base64 --decode \
            | gzip --decompress > /tmp/parse_es_pv.py
          cat .github/es-pv-parser/patch.b64.* \
            | base64 --decode \
            | gzip --decompress > /tmp/es-pv-fixes.patch
          git apply --check /tmp/es-pv-fixes.patch
          git apply /tmp/es-pv-fixes.patch

      - name: Regenerate Euskadi dataset
        run: |
          python -m pip install --disable-pip-version-check pdfplumber
          mkdir -p /tmp/es-pv-parser
          cp /tmp/parse_es_pv.py /tmp/es-pv-parser/parse_es_pv.py
          curl --fail --location --retry 3 \
            'https://www.euskadi.eus/bopv2/datos/2023/06/2302729e.pdf' \
            --output /tmp/es-pv-parser/eu.pdf
          curl --fail --location --retry 3 \
            'https://www.euskadi.eus/bopv2/datos/2023/06/2302727e.pdf' \
            --output /tmp/es-pv-parser/inf.pdf
          (
            cd /tmp/es-pv-parser
            python parse_es_pv.py
          )
          mv /tmp/es-pv-parser/generated.json \
            public/files/perm/idevices/base/lomloe/data/lomloe-ES-PV.json

      - name: Validate generated curriculum and refresh documentation stats
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('public/files/perm/idevices/base/lomloe/data/lomloe-ES-PV.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          primaria = data['Lehen Hezkuntza']
          eso = data['Derrigorrezko Bigarren Hezkuntza']

          expected = {
              'DBHko 1. maila': {'MUS'},
              'DBHko 2. maila': {'MUS'},
              'DBHko 3. maila': {'MUS', 'KZ'},
              'DBHko 4. maila': {'MUS', 'LAT', 'AA', 'KZ', 'ML'},
          }
          for level, codes in expected.items():
              missing = codes - set(eso[level])
              assert not missing, f'{level} missing subjects: {sorted(missing)}'

          for level in ('DBHko 1. maila', 'DBHko 2. maila', 'DBHko 3. maila'):
              assert 'AA' not in eso[level], f'AA must only appear in 4.º: {level}'

          workshop = eso['DBHko 4. maila']['ML']
          assert workshop['competencias_especificas'] == {}
          assert workshop['saberes_basicos']['bloques'] == {}

          for level, areas in eso.items():
              assert 'Produkzio musikal' not in json.dumps(areas['MAT'], ensure_ascii=False), level

          for stage_name, stage in (
              ('Lehen Hezkuntza', primaria),
              ('Derrigorrezko Bigarren Hezkuntza', eso),
          ):
              for level, areas in stage.items():
                  for area_code, area in areas.items():
                      for comp_code, comp in area['competencias_especificas'].items():
                          descriptors = {
                              code
                              for criterion in comp['criterios_evaluacion']
                              for code in criterion['competencias_clave']
                          }
                          assert descriptors, (
                              f'No descriptors: {stage_name}/{level}/{area_code}/{comp_code}'
                          )

          unique_areas = len({code for areas in eso.values() for code in areas})
          competencias = sum(
              len(area['competencias_especificas'])
              for areas in eso.values()
              for area in areas.values()
          )
          criterios = sum(
              len(comp['criterios_evaluacion'])
              for areas in eso.values()
              for area in areas.values()
              for comp in area['competencias_especificas'].values()
          )
          saberes = sum(
              len(items)
              for areas in eso.values()
              for area in areas.values()
              for items in area['saberes_basicos']['bloques'].values()
          )

          def format_count(value):
              return f'{value:,}'.replace(',', ' ')

          readme_path = Path('public/files/perm/idevices/base/lomloe/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          replacement = (
              '| `Derrigorrezko Bigarren Hezkuntza` | `DBHko 1. maila` … `4. maila` | '
              f'{unique_areas} | {format_count(competencias)} | {format_count(criterios)} | '
              f'{format_count(saberes)} | `ESO1` … `ESO4` |'
          )
          readme, count = re.subn(
              r'^\| `Derrigorrezko Bigarren Hezkuntza` .*$',
              replacement,
              readme,
              count=1,
              flags=re.MULTILINE,
          )
          assert count == 1
          readme_path.write_text(readme, encoding='utf-8')
          print({
              'unique_areas': unique_areas,
              'competencias': competencias,
              'criterios': criterios,
              'saberes': saberes,
          })
          PY

      - name: Run focused tests
        run: |
          bun install --frozen-lockfile
          bun x vitest run \
            public/files/perm/idevices/base/lomloe/data/lomloe-ES-PV.test.js \
            public/files/perm/idevices/base/lomloe/edition/lomloe.test.js

      - name: Commit fixes to the pull request branch
        run: |
          rm -rf .github/es-pv-parser
          rm .github/workflows/debug-es-pv-parser.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(lomloe): complete Euskadi curriculum extraction'
          git push origin HEAD:feat/lomloe-add-euskadi-dataset
