name: Debug Euskadi curriculum parser

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/lomloe-add-euskadi-dataset
    paths:
      - .github/workflows/debug-es-pv-parser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Package parser workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          import requests

          downloads = {
              'workspace/eu.pdf': 'https://www.euskadi.eus/bopv2/datos/2023/06/2302729e.pdf',
              'workspace/inf.pdf': 'https://www.euskadi.eus/bopv2/datos/2023/06/2302727e.pdf',
          }
          for output, url in downloads.items():
              response = requests.get(url, timeout=120)
              response.raise_for_status()
              Path(output).parent.mkdir(parents=True, exist_ok=True)
              Path(output).write_bytes(response.content)

          api_url = 'https://api.github.com/repos/exelearning/exelearning/issues/comments/4848125611'
          response = requests.get(
              api_url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              timeout=60,
          )
          response.raise_for_status()
          match = re.search(r'```python\n(.*?)\n```', response.json()['body'], re.S)
          if not match:
              raise SystemExit('Parser code block not found')
          script = match.group(1)
          script = re.sub(r"^EU = .*?$", "EU = 'eu.pdf'", script, flags=re.M)
          script = re.sub(r"^INF = .*?$", "INF = 'inf.pdf'", script, flags=re.M)
          script = re.sub(r"^OUT = .*?$", "OUT = 'generated.json'", script, flags=re.M)
          Path('workspace/parse_es_pv.py').write_text(script + '\n', encoding='utf-8')
          PY

          mkdir -p workspace/repo/public/files/perm/idevices/base/lomloe/data
          mkdir -p workspace/repo/public/files/perm/idevices/base/lomloe/edition
          cp public/files/perm/idevices/base/lomloe/data/lomloe-ES-PV.json workspace/repo/public/files/perm/idevices/base/lomloe/data/
          cp public/files/perm/idevices/base/lomloe/data/lomloe-ES-PV.test.js workspace/repo/public/files/perm/idevices/base/lomloe/data/
          cp public/files/perm/idevices/base/lomloe/edition/lomloe.js workspace/repo/public/files/perm/idevices/base/lomloe/edition/
          cp public/files/perm/idevices/base/lomloe/edition/lomloe.test.js workspace/repo/public/files/perm/idevices/base/lomloe/edition/
          cp public/files/perm/idevices/base/lomloe/README.md workspace/repo/public/files/perm/idevices/base/lomloe/
          cp public/CHANGELOG.md workspace/repo/public/

      - uses: actions/upload-artifact@v4
        with:
          name: es-pv-parser-workspace
          path: workspace
          compression-level: 6
