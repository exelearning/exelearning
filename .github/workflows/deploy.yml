name: Docker Compose Database Compatibility Matrix

on:
  push:
   branches:
     - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to test'
        required: false
        default: 'main'

jobs:
  test-compose:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            app_port: 8081
          - db: mariadb
            app_port: 8082
          - db: sqlite
            app_port: 8083

    env:
      TAG: ${{ inputs.tag || 'main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Start ${{ matrix.db }} stack
        run: docker compose -p ${{ matrix.db }} -f doc/deploy/docker-compose.${{ matrix.db }}.yml up -d
        env:
          APP_PORT: ${{ matrix.app_port }}

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to be available at http://localhost:${{ matrix.app_port }}"
          for i in {1..60}; do
            if curl -s http://localhost:${{ matrix.app_port }}/healthcheck | grep -q 'ok'; then
              echo "App is up!"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 3
          done
          echo "App did not become ready in time" >&2
          docker compose -p ${{ matrix.db }} -f doc/deploy/docker-compose.${{ matrix.db }}.yml logs
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against ${{ matrix.db }}
        run: |
          npx playwright test --project=chromium --reporter=list
        env:
          E2E_BASE_URL: http://localhost:${{ matrix.app_port }}
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.db }}
          path: playwright-report/
          retention-days: 7

      - name: Dump Docker Compose logs on failure
        if: failure()
        run: |
          # Print all service logs for debugging
          docker compose -p ${{ matrix.db }} \
            -f doc/deploy/docker-compose.${{ matrix.db }}.yml \
            logs

      - name: Stop services
        if: always()
        run: docker compose -p ${{ matrix.db }} -f doc/deploy/docker-compose.${{ matrix.db }}.yml down -v
