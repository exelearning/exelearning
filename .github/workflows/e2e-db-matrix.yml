name: E2E Database Compatibility Matrix

on:
  push:
    branches:
      - main
  # Dependency bumps are the one change class that can move the runtime floor
  # out from under this matrix (a jsdom major raised the Node requirement and
  # broke all three databases on main), and it is otherwise only exercised
  # after merge. Run it on PRs that touch the dependency manifests — every
  # dependabot PR, plus any hand-written bump — so that lands as a red PR
  # check instead of a red main.
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - bun.lock
      - .github/workflows/e2e-db-matrix.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mariadb]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # `bun x playwright` honours the CLI's `#!/usr/bin/env node` shebang,
          # so the specs (and everything they import from src/) run under this
          # Node. jsdom >= 30 pulls undici 8, which needs Node >= 22.19 for
          # worker_threads.markAsUncloneable. 22 also matches the Node the
          # ubuntu-latest image ships, which every other workflow already uses.
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests with ${{ matrix.db }}
        run: make test-e2e-${{ matrix.db }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.db }}
          path: playwright-report/
          retention-days: 7
