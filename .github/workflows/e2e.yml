name: E2E Tests

on:
  pull_request:
    branches:
      - main
      - tikismaker
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-preview-test-contract-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/opaque-iframe-external-media
          fetch-depth: 0

      - name: Format the updated panel test
        run: |
          bunx @biomejs/biome format --write public/app/workarea/interface/elements/previewPanel.test.js
          git diff --check

      - name: Restore normal workflows and publish the clean test commit
        shell: bash
        run: |
          set -euo pipefail
          git show 1009e0044546710a45e32ad4788bfb2bcc7493ba:.github/workflows/e2e.yml > .github/workflows/e2e.yml
          git rm -f .github/workflows/apply-preview-test-contract-patch.yml
          git add public/app/workarea/interface/elements/previewPanel.test.js .github/workflows/e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(preview): align panel tests with hardened transport gates"
          git push origin HEAD:fix/opaque-iframe-external-media
