name: Deploy PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        if: github.event.action != 'closed'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: bun install

      - name: Generate version string
        if: github.event.action != 'closed'
        id: version
        run: |
          DATE=$(date +%Y%m%d%H%M%S)
          VERSION="v0.0.0-pr${{ github.event.number }}-${DATE}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build static distribution
        if: github.event.action != 'closed'
        run: VERSION=${{ steps.version.outputs.version }} bun run build:static

      # GitHub Pages preview (temporary, will be deleted when PR is closed)
      - name: Deploy to GitHub Pages (temporary preview)
        id: deploy-gh
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/static/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          qr-code: true

      # Cloudflare Pages preview (persistent until manually deleted)
      - name: Deploy to Cloudflare Pages
        if: github.event.action != 'closed'
        id: deploy-cf
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist/static/ --project-name=exelearning-preview --branch=pr-${{ github.event.number }}

      - name: Add preview URLs to summary
        if: github.event.action != 'closed'
        run: |
          echo "## 🚀 PR Preview Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Pages (temporary)" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ This preview will be automatically deleted when the PR is closed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy-gh.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deploy-cf.outcome }}" == "success" ]; then
            echo "### Cloudflare Pages (persistent)" >> $GITHUB_STEP_SUMMARY
            echo "This preview will remain available until manually deleted." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** https://pr-${{ github.event.number }}.exelearning-preview.pages.dev" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Cloudflare deployment skipped (not configured or failed)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR with preview URLs
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const ghUrl = '${{ steps.deploy-gh.outputs.deployment-url }}';
            const cfUrl = 'https://pr-${{ github.event.number }}.exelearning-preview.pages.dev';
            const cfOutcome = '${{ steps.deploy-cf.outcome }}';
            const version = '${{ steps.version.outputs.version }}';

            let cfSection;
            if (cfOutcome === 'success' && cfUrl) {
              cfSection = `| Cloudflare Pages | ${cfUrl} | ✅ Persistent |`;
            } else {
              cfSection = `| Cloudflare Pages | N/A | ⚠️ Not configured |`;
            }

            const body = `## 🚀 Preview Deployed

            **Version:** \`${version}\`

            | Environment | URL | Status |
            |-------------|-----|--------|
            | GitHub Pages | ${ghUrl} | ⚠️ Temporary (deleted on PR close) |
            ${cfSection}

            ---
            <sub>Last updated: ${new Date().toISOString()}</sub>`;

            // Find existing comment from this workflow
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Preview Deployed')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Comment on PR when preview is deleted
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const cfUrl = 'https://pr-${{ github.event.number }}.exelearning-preview.pages.dev';

            const body = `## 🗑️ GitHub Pages Preview Deleted

            The temporary GitHub Pages preview has been removed.

            If Cloudflare was configured, the preview may still be available at:
            ${cfUrl}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
