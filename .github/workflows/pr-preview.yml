name: Deploy PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

env:
  CF_PROJECT_NAME: exelearning-preview
  CF_BRANCH_NAME: pr-${{ github.event.number }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate version string
        id: version
        run: |
          VERSION="v0.0.0-pr${{ github.event.number }}-$(date +%Y%m%d%H%M)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build static distribution
        run: VERSION=${{ steps.version.outputs.version }} bun run build:static

      - name: Deploy to GitHub Pages
        id: deploy-gh
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/static/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          qr-code: true

      - name: Delete old Cloudflare deployments
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials not configured, skipping cleanup"
            exit 0
          fi

          echo "Cleaning up old deployments for branch: $CF_BRANCH_NAME"

          DEPLOYMENTS=$(curl -s \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/deployments?env=preview")

          DEPLOYMENT_IDS=$(echo "$DEPLOYMENTS" | jq -r ".result[] | select(.deployment_trigger.metadata.branch == \"$CF_BRANCH_NAME\") | .id")

          for ID in $DEPLOYMENT_IDS; do
            echo "Deleting deployment: $ID"
            curl -s -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/deployments/$ID"
          done

      - name: Deploy to Cloudflare Pages
        id: deploy-cf
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist/static/ --project-name=${{ env.CF_PROJECT_NAME }} --branch=${{ env.CF_BRANCH_NAME }}

      - name: Add summary
        run: |
          {
            echo "## 🚀 PR Preview Deployed"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.version }}"
            echo ""
            echo "### GitHub Pages (temporary)"
            echo "⚠️ Deleted when PR is closed."
            echo "**URL:** ${{ steps.deploy-gh.outputs.deployment-url }}"
            echo ""
            if [ "${{ steps.deploy-cf.outcome }}" == "success" ]; then
              echo "### Cloudflare Pages"
              echo "**URL:** https://${{ env.CF_BRANCH_NAME }}.${{ env.CF_PROJECT_NAME }}.pages.dev"
            else
              echo "### Cloudflare Pages"
              echo "⚠️ Deployment skipped or failed."
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const ghUrl = '${{ steps.deploy-gh.outputs.deployment-url }}';
            const cfUrl = 'https://${{ env.CF_BRANCH_NAME }}.${{ env.CF_PROJECT_NAME }}.pages.dev';
            const cfOutcome = '${{ steps.deploy-cf.outcome }}';
            const version = '${{ steps.version.outputs.version }}';

            const cfRow = cfOutcome === 'success'
              ? `| Cloudflare Pages | ${cfUrl} | ✅ Active |`
              : `| Cloudflare Pages | N/A | ⚠️ Not configured |`;

            const body = `## 🚀 Preview Deployed

            **Version:** \`${version}\`

            | Environment | URL | Status |
            |-------------|-----|--------|
            | GitHub Pages | ${ghUrl} | ⚠️ Temporary |
            ${cfRow}

            ---
            <sub>Updated: ${new Date().toISOString().slice(0, 16).replace('T', ' ')}</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🚀 Preview Deployed')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub Pages cleanup is handled automatically by pr-preview-action with action: auto
      - name: Delete GitHub Pages preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/static/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto

      - name: Delete Cloudflare Pages deployments
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials not configured, skipping cleanup"
            exit 0
          fi

          echo "Deleting all deployments for branch: $CF_BRANCH_NAME"

          DEPLOYMENTS=$(curl -s \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/deployments?env=preview")

          DEPLOYMENT_IDS=$(echo "$DEPLOYMENTS" | jq -r ".result[] | select(.deployment_trigger.metadata.branch == \"$CF_BRANCH_NAME\") | .id")

          if [ -z "$DEPLOYMENT_IDS" ]; then
            echo "No deployments found for branch $CF_BRANCH_NAME"
            exit 0
          fi

          for ID in $DEPLOYMENT_IDS; do
            echo "Deleting deployment: $ID"
            curl -s -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/deployments/$ID"
          done

          echo "Cleanup complete"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🗑️ Previews Deleted

            Both GitHub Pages and Cloudflare Pages previews have been cleaned up.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
