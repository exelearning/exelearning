version: 2
updates:

  # JavaScript dependencies (Bun). The root package manager is Bun and the
  # real lockfile is bun.lock: the previous "npm" entry only ever rewrote
  # package.json, leaving bun.lock stale (#2225, #2229) and CVEs pinned in the
  # lockfile invisible to Dependabot (#2241, #2286). Dependabot only supports
  # *version* updates for Bun — security updates and the Dependency Graph do
  # not read bun.lock — so CVE coverage for the lockfile still needs an
  # external scanner on top of this entry.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Playwright 1.62 ships a Firefox build whose driver intermittently
      # never attaches the SW-served preview iframe, hanging frameLocator
      # calls (#2291). Held at ~1.58.2; re-test new releases per the issue's
      # exit criteria and drop this together with the pin once fixed.
      - dependency-name: "@playwright/test"
        versions: [">=1.59"]
    groups:
      # Yjs ecosystem: keep in sync — shim build depends on compatible versions
      yjs-ecosystem:
        patterns:
          - "yjs"
          - "y-*"
          - "lib0"
      # MathJax: pinned separately — exe_math/ is a custom subset requiring manual validation
      mathjax:
        patterns:
          - "mathjax-full"
      # Elysia framework
      elysia:
        patterns:
          - "elysia"
          - "@elysiajs/*"
      # Test tooling
      test-tools:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/test"
          - "happy-dom"
      # Build tooling
      build-tools:
        patterns:
          - "esbuild"
          - "vite"
          - "sass"
          - "@biomejs/*"
      # Vendored front-end libraries: browser assets generated from npm by
      # scripts/copy-vendor-libs.js (the bundle:vendor build step). Grouped so
      # updates to these shipped-to-browser libs are reviewed together.
      frontend-libs:
        patterns:
          - "jquery"
          - "jquery-ui"
          - "bootstrap"
          - "showdown"
          - "fflate"
          - "abcjs"
          - "html2canvas"
          - "interactjs"
          - "simplelightbox"
          - "dompurify"
          - "fabric"

  # Electron main-process dependencies. app/ has its own manifest and lockfile,
  # which the "/" entry above does not cover, so electron-updater, electron-log,
  # electron-context-menu and fflate had gone unmanaged since #1103 even though
  # they are the packages that ship inside app.asar.
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"

  # Dockerfile dependencies (e.g., base images)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker Compose variants for different DBs
  - package-ecosystem: "docker-compose"
    directory: "/doc/deploy"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
