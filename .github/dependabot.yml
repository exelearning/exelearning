version: 2
updates:

  # JavaScript dependencies (Bun). The root package manager is Bun and the
  # real lockfile is bun.lock: the previous "npm" entry only ever rewrote
  # package.json, leaving bun.lock stale (#2225, #2229) and CVEs pinned in the
  # lockfile invisible to Dependabot (#2241, #2286). Dependabot only supports
  # *version* updates for Bun — security updates and the Dependency Graph do
  # not read bun.lock — so CVE coverage for the lockfile still needs an
  # external scanner on top of this entry.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"

  # Electron main-process dependencies. app/ has its own manifest and lockfile,
  # which the "/" entry above does not cover, so electron-updater, electron-log,
  # electron-context-menu and fflate had gone unmanaged since #1103 even though
  # they are the packages that ship inside app.asar.
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"

  # Dockerfile dependencies (e.g., base images)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker Compose variants for different DBs
  - package-ecosystem: "docker-compose"
    directory: "/doc/deploy"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
