version: 2
updates:

  # JavaScript/Node dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Yjs ecosystem: keep in sync — shim build depends on compatible versions
      yjs-ecosystem:
        patterns:
          - "yjs"
          - "y-*"
          - "lib0"
      # MathJax: pinned separately — exe_math/ is a custom subset requiring manual validation
      mathjax:
        patterns:
          - "mathjax-full"
      # Elysia framework
      elysia:
        patterns:
          - "elysia"
          - "@elysiajs/*"
      # Test tooling
      test-tools:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/test"
          - "happy-dom"
      # Build tooling
      build-tools:
        patterns:
          - "esbuild"
          - "vite"
          - "sass"
          - "@biomejs/*"
      # Vendored front-end libraries: browser assets generated from npm by
      # scripts/copy-vendor-libs.js (the bundle:vendor build step). Grouped so
      # updates to these shipped-to-browser libs are reviewed together.
      frontend-libs:
        patterns:
          - "jquery"
          - "jquery-ui"
          - "bootstrap"
          - "showdown"
          - "fflate"
          - "abcjs"
          - "html2canvas"
          - "interactjs"
          - "simplelightbox"
          - "dompurify"
          - "fabric"

  # Dockerfile dependencies (e.g., base images)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker Compose variants for different DBs
  - package-ecosystem: "docker-compose"
    directory: "/doc/deploy"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
